
<svg width="60" height="60" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <!-- Transparent background -->
  <rect x="0" y="0" width="" height="" fill="none"/>

  <!-- Clock body -->
  <circle cx="70" cy="100" r="40" fill="#ffffff" stroke="#333" stroke-width="3"/>

  <!-- Clock ticks -->
  <line x1="70" y1="62" x2="70" y2="68" stroke="#333" stroke-width="2"/>
  <line x1="70" y1="132" x2="70" y2="138" stroke="#333" stroke-width="2"/>
  <line x1="32" y1="100" x2="38" y2="100" stroke="#333" stroke-width="2"/>
  <line x1="102" y1="100" x2="108" y2="100" stroke="#333" stroke-width="2"/>

  <!-- Clock hands -->
  <line x1="70" y1="100" x2="70" y2="80" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="70" y1="100" x2="88" y2="100" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Jet body (fuselage) -->
  <path d="M90 90 L150 70 Q158 68 162 72 Q166 76 162 80 L140 92 Z"
        fill="#e0e4ea" stroke="#333" stroke-width="2"/>

  <!-- Jet nose highlight -->
  <path d="M148 71 Q156 69 160 73 Q156 73 150 75 Z"
        fill="#c7ccd6" stroke="none"/>

  <!-- Jet cockpit window -->
  <path d="M132 76 Q136 74 140 74 Q141 77 140 80 Q136 80 132 79 Z"
        fill="#3b4a63" stroke="#333" stroke-width="1"/>

  <!-- Jet tail fin -->
  <path d="M104 84 L96 66 L104 68 L114 82 Z"
        fill="#e0e4ea" stroke="#333" stroke-width="2"/>

  <!-- Left wing -->
  <path d="M112 86 L96 60 L104 60 L124 82 Z"
        fill="#e0e4ea" stroke="#333" stroke-width="2"/>

  <!-- Right wing -->
  <path d="M120 88 L110 64 L118 66 L134 86 Z"
        fill="#e0e4ea" stroke="#333" stroke-width="2"/>

  <!-- Jet engines under wings -->
  <ellipse cx="116" cy="88" rx="4" ry="3" fill="#c7ccd6" stroke="#333" stroke-width="1"/>
  <ellipse cx="126" cy="86" rx="4" ry="3" fill="#c7ccd6" stroke="#333" stroke-width="1"/>

  <!-- Windows on fuselage -->
  <circle cx="118" cy="78" r="1.3" fill="#3b4a63"/>
  <circle cx="122" cy="77" r="1.3" fill="#3b4a63"/>
  <circle cx="126" cy="76" r="1.3" fill="#3b4a63"/>

  <!-- Motion lines from clock to jet -->
  <path d="M86 92 C96 88 104 86 112 84" stroke="#999" stroke-width="2" stroke-linecap="round"/>
  <path d="M84 98 C94 94 102 92 110 90" stroke="#bbb" stroke-width="1.5" stroke-linecap="round"/>

</svg>
